<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rooms</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f17;
      color: #e0e0e8;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #1a1a2a;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
    }
    #filter {
      flex: 1;
      padding: 6px 10px;
      background: #0f0f17;
      border: 1px solid #3a3a4a;
      border-radius: 7px;
      color: #e0e0e8;
      font-size: 13px;
      outline: none;
    }
    #filter:focus { border-color: #7c5cbf; }
    #refresh-btn {
      padding: 6px 14px;
      background: #2a2a3a;
      border: 1px solid #3a3a4a;
      border-radius: 7px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
    }
    #refresh-btn:hover { border-color: #7c5cbf; color: #e0e0e8; }

    /* Tabs */
    #tabs { display: flex; background: #1a1a2a; border-bottom: 1px solid #2a2a3a; flex-shrink: 0; }
    .tab {
      padding: 7px 18px;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active { color: #c09af0; border-color: #7c5cbf; }

    #list {
      flex: 1;
      overflow-y: auto;
    }

    .room-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid #1a1a2a;
      cursor: default;
    }
    .room-row:hover { background: #151520; }

    .room-count {
      min-width: 36px;
      text-align: right;
      font-size: 12px;
      color: #555;
      font-variant-numeric: tabular-nums;
    }
    .room-name {
      flex: 1;
      font-size: 13px;
      text-transform: capitalize;
    }

    .join-btn {
      padding: 3px 10px;
      font-size: 11px;
      background: #7c5cbf;
      border: none;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .room-row:hover .join-btn { opacity: 1; }

    /* Star (favourite) toggle */
    .star-btn {
      background: none;
      border: none;
      font-size: 15px;
      cursor: pointer;
      color: #333;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.15s;
    }
    .star-btn.on  { color: #f0c040; }
    .star-btn:hover { color: #f0c040; }

    /* Auto-join toggle */
    .aj-label {
      font-size: 11px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .aj-label input { accent-color: #7c5cbf; cursor: pointer; }
    .aj-label.on { color: #c09af0; }

    #empty { color: #444; text-align: center; margin-top: 60px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="filter" type="text" placeholder="Filter rooms…" autocomplete="off">
    <button id="refresh-btn">Refresh</button>
  </div>
  <div id="tabs">
    <div class="tab active" data-tab="all">All rooms</div>
    <div class="tab" data-tab="fav">Favourites</div>
  </div>
  <div id="list"><p id="empty">Loading…</p></div>

  <script>
    let allRooms = [];
    let favourites = {}; // jid → {name, autoJoin}
    let activeTab = 'all';

    const listEl   = document.getElementById('list');
    const filterEl = document.getElementById('filter');

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function load() {
      listEl.innerHTML = '<p id="empty">Loading…</p>';
      [allRooms, favourites] = await Promise.all([
        window.roomsAPI.getRooms(),
        window.roomsAPI.getFavourites(),
      ]);
      render();
    }

    function render() {
      const q = filterEl.value.trim().toLowerCase();
      let rooms = activeTab === 'fav'
        ? allRooms.filter(r => favourites[r.jid])
        : allRooms;
      if (q) rooms = rooms.filter(r => r.name.toLowerCase().includes(q));

      if (!rooms.length) {
        listEl.innerHTML = '<p id="empty">No rooms found.</p>';
        return;
      }

      listEl.innerHTML = rooms.map(r => {
        const isFav = !!favourites[r.jid];
        const isAJ  = favourites[r.jid]?.autoJoin ?? false;
        return `
          <div class="room-row" data-jid="${esc(r.jid)}">
            <span class="room-count">${r.count}</span>
            <span class="room-name">${esc(r.name)}</span>
            <button class="join-btn">Join</button>
            ${isFav ? `<label class="aj-label ${isAJ ? 'on' : ''}">
              <input type="checkbox" class="aj-chk" ${isAJ ? 'checked' : ''}> auto-join
            </label>` : ''}
            <button class="star-btn ${isFav ? 'on' : ''}" title="${isFav ? 'Remove from favourites' : 'Add to favourites'}">★</button>
          </div>`;
      }).join('');

      // Event delegation
      listEl.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const jid = btn.closest('.room-row').dataset.jid;
          window.roomsAPI.joinRoom(jid);
        });
      });

      listEl.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const row = btn.closest('.room-row');
          const jid  = row.dataset.jid;
          const name = row.querySelector('.room-name').textContent.trim();
          const isFav = !!favourites[jid];
          await window.roomsAPI.setFavourite(jid, name, !isFav);
          favourites = await window.roomsAPI.getFavourites();
          render();
        });
      });

      listEl.querySelectorAll('.aj-chk').forEach(chk => {
        chk.addEventListener('change', async () => {
          const jid = chk.closest('.room-row').dataset.jid;
          await window.roomsAPI.setAutoJoin(jid, chk.checked);
          favourites = await window.roomsAPI.getFavourites();
          render();
        });
      });
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        activeTab = t.dataset.tab;
        render();
      });
    });

    filterEl.addEventListener('input', render);
    document.getElementById('refresh-btn').addEventListener('click', load);

    load();
  </script>
</body>
</html>
