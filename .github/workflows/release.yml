name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: npm run build:linux -- --publish never
            artifact: dist/LitChat-linux.AppImage
          - os: windows-latest
            build: npm run build:win -- --publish never
            artifact: dist/LitChat-windows*.exe
          - os: macos-latest
            build: npm run build:mac -- --publish never
            artifact: dist/LitChat-mac.*

    runs-on: ${{ matrix.os }}

    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: ${{ matrix.build }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            ${{ matrix.artifact }}
            dist/*.yml

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # The release body is this version's section of CHANGELOG.md. GitHub prepends
      # it to the auto-generated notes, which add the "Full Changelog" compare link.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { in_section = (index($0, "## [" v "]") == 1); next }
            /^\[[0-9][^]]*\]: / { in_section = 0 }
            in_section
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version; the release will only have the auto-generated notes"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body_path: release-notes.md
          generate_release_notes: true
