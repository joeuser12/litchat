<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Logs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f17;
      color: #e0e0e8;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      overflow: hidden;
    }

    #toolbar {
      background: #1a1a2a;
      border-bottom: 1px solid #2a2a3a;
      flex-shrink: 0;
    }

    #tabs {
      display: flex;
      gap: 0;
      padding: 8px 16px 0;
    }
    .tab-btn {
      padding: 6px 16px;
      background: none;
      border: 1px solid #2a2a3a;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: #666;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      margin-right: 4px;
    }
    .tab-btn:hover { color: #aaa; }
    .tab-btn.active { background: #0f0f17; color: #e0e0e8; border-color: #2a2a3a; }

    #search-row {
      display: flex;
      gap: 8px;
      padding: 10px 16px 12px;
    }

    .search-input {
      flex: 1;
      padding: 8px 12px;
      background: #0f0f17;
      border: 1px solid #3a3a4a;
      border-radius: 8px;
      color: #e0e0e8;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #7c5cbf; }

    .search-btn {
      padding: 8px 20px;
      background: #7c5cbf;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .search-btn:hover { background: #9370db; }

    #messages {
      overflow-y: auto;
      padding: 12px;
    }

    .placeholder {
      color: #555;
      text-align: center;
      margin-top: 60px;
      font-size: 14px;
    }

    /* Context groups (DM / per-room) */
    .ctx-group { margin-bottom: 8px; border-radius: 10px; overflow: hidden; border: 1px solid #2a2a3a; }

    .ctx-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a1a2a;
      cursor: pointer;
      user-select: none;
    }
    .ctx-header:hover { background: #222236; }
    .ctx-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.03em;
    }
    .ctx-badge.dm   { background: #3a1f5a; color: #c09af0; }
    .ctx-badge.room { background: #1a2f3a; color: #6ab0d4; }
    .ctx-title { font-size: 13px; color: #ccc; flex: 1; }
    .ctx-count { font-size: 11px; color: #555; }
    .ctx-chevron { font-size: 11px; color: #555; transition: transform 0.2s; }
    .ctx-group.collapsed .ctx-chevron { transform: rotate(-90deg); }
    .ctx-del {
      font-size: 13px; color: #555; cursor: pointer; padding: 0 4px;
      border-radius: 3px; line-height: 1; visibility: hidden;
      transition: color 0.12s, background 0.12s;
    }
    .ctx-header:hover .ctx-del { visibility: visible; }
    .ctx-del:hover { color: #e05; background: rgba(220,0,60,0.12); }

    .ctx-messages {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      background: #0f0f17;
      overflow: hidden;
    }
    .ctx-group.collapsed .ctx-messages { display: none; }

    .msg {
      max-width: 80%;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg .meta { font-size: 11px; opacity: 0.4; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; }
    .msg-del {
      font-size: 12px; cursor: pointer; opacity: 0; padding: 0 3px;
      border-radius: 3px; line-height: 1; margin-left: auto; flex-shrink: 0;
      transition: opacity 0.12s, color 0.12s, background 0.12s;
    }
    .msg:hover .msg-del { opacity: 0.6; }
    .msg-del:hover { opacity: 1 !important; color: #e05; background: rgba(220,0,60,0.15); }
    .sent     { align-self: flex-end;   background: #2a1f4a; border-bottom-right-radius: 3px; }
    .received { align-self: flex-start; background: #1a2a3a; border-bottom-left-radius: 3px; }
    .sent + .sent         { border-top-right-radius: 3px; }
    .received + .received { border-top-left-radius: 3px; }

    .date-sep {
      align-self: center;
      font-size: 11px;
      color: #555;
      padding: 3px 8px;
      background: #1a1a2a;
      border-radius: 8px;
      margin: 4px 0;
    }

    mark {
      background: #6a3f00;
      color: #ffd080;
      border-radius: 2px;
      padding: 0 1px;
    }

    .msg-link { color: #818cf8; text-decoration: underline; cursor: pointer; }
    .msg-link:hover { color: #a5b4fc; }

    #notes-panel {
      display: none;
      flex-shrink: 0;
      padding: 10px 16px 12px;
      background: #1a1a2a;
      border-top: 1px solid #2a2a3a;
    }
    #notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    #notes-panel label {
      font-size: 11px;
      color: #888;
    }
    #watch-btn {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 5px;
      border: 1px solid #3a3a4a;
      background: #0f0f17;
      color: #888;
      cursor: pointer;
      transition: all 0.15s;
    }
    #watch-btn.watching {
      border-color: #7c5cbf;
      color: #c09af0;
      background: #1f1035;
    }
    #watch-btn:hover { border-color: #7c5cbf; color: #c09af0; }
    #notes-row { display: flex; gap: 8px; align-items: flex-end; }
    #note-text {
      flex: 1;
      padding: 7px 10px;
      background: #0f0f17;
      border: 1px solid #3a3a4a;
      border-radius: 8px;
      color: #e0e0e8;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      min-height: 54px;
      outline: none;
    }
    #note-text:focus { border-color: #7c5cbf; }
    #save-note {
      padding: 7px 16px;
      background: #7c5cbf;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #save-note:hover { background: #9370db; }
    #save-confirm {
      font-size: 11px;
      color: #7c5cbf;
      margin-top: 4px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <div id="tabs">
      <button class="tab-btn active" data-tab="user">By User</button>
      <button class="tab-btn" data-tab="search">Search</button>
    </div>
    <div id="search-row">
      <input id="username" class="search-input" type="text" placeholder="Username…" list="suggestions" autocomplete="off" spellcheck="false">
      <datalist id="suggestions"></datalist>
      <button id="btn" class="search-btn">View</button>

      <input id="searchtext" class="search-input" type="text" placeholder="Search messages…" autocomplete="off" spellcheck="false" style="display:none">
      <button id="searchbtn" class="search-btn" style="display:none">Search</button>
    </div>
  </div>

  <div id="messages">
    <p class="placeholder">Enter a username to view conversation history.</p>
  </div>

  <div id="notes-panel">
    <div id="notes-header">
      <label id="notes-label">Notes</label>
      <button id="watch-btn">Watch for presence</button>
    </div>
    <div id="notes-row">
      <textarea id="note-text" placeholder="Private notes about this user…" rows="2"></textarea>
      <button id="save-note">Save</button>
    </div>
    <div id="save-confirm"></div>
  </div>

  <script>
    const input    = document.getElementById('username');
    const btn      = document.getElementById('btn');
    const msgsEl   = document.getElementById('messages');
    const datalist = document.getElementById('suggestions');
    const searchTextInput = document.getElementById('searchtext');
    const searchBtn       = document.getElementById('searchbtn');

    let activeTab = 'user';

    // Populate autocomplete
    for (const u of window.logAPI.listUsers()) {
      const opt = document.createElement('option');
      opt.value = u;
      datalist.appendChild(opt);
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        const isUser = activeTab === 'user';
        input.style.display        = isUser ? '' : 'none';
        document.getElementById('btn').style.display = isUser ? '' : 'none';
        datalist.style.display     = isUser ? '' : 'none';
        searchTextInput.style.display = isUser ? 'none' : '';
        searchBtn.style.display       = isUser ? 'none' : '';
        notesPanel.style.display   = 'none';
        if (isUser) {
          msgsEl.innerHTML = '<p class="placeholder">Enter a username to view conversation history.</p>';
          loadRecent();
        } else {
          msgsEl.innerHTML = '<p class="placeholder">Enter text to search all messages.</p>';
          setTimeout(() => searchTextInput.focus(), 50);
        }
      });
    });

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function unescapeXml(s) {
      return s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
    }

    function highlight(text, query) {
      if (!query) return esc(text);
      const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return text.split(re).map((part, i) =>
        i % 2 === 1 ? `<mark>${esc(part)}</mark>` : esc(part)
      ).join('');
    }

    const URL_RE = /https?:\/\/[^\s<>"')\]]+/g;

    function linkifyAndHighlight(text, query) {
      const parts = [];
      let last = 0;
      let m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(text)) !== null) {
        if (m.index > last) parts.push(highlight(text.slice(last, m.index), query));
        // Strip trailing punctuation that is likely not part of the URL
        let url = m[0].replace(/[.,;:!?)]+$/, '');
        parts.push(`<a href="${esc(url)}" target="_blank" class="msg-link">${highlight(url, query)}</a>`);
        last = m.index + m[0].length;
      }
      if (last < text.length) parts.push(highlight(text.slice(last), query));
      return parts.join('');
    }

    function fmtTime(iso) {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderMessages(messages, query) {
      const frags = [];
      let lastDate = null;
      for (const m of messages) {
        const date = new Date(m.ts).toDateString();
        if (date !== lastDate) {
          frags.push(`<div class="date-sep">${esc(fmtDate(m.ts))}</div>`);
          lastDate = date;
        }
        const side = m.direction === 'sent' ? 'sent' : 'received';
        const peer = m.direction === 'sent' ? m.toUser : m.fromUser;
        const body = linkifyAndHighlight(unescapeXml(m.body || ''), query);
        frags.push(`<div class="msg ${side}">
          <div class="meta"><span>${esc(peer ?? '')} · ${esc(fmtTime(m.ts))}</span><span class="msg-del" data-sig="${esc(m.sig)}" title="Delete message">×</span></div>
          <div>${body}</div>
        </div>`);
      }
      return frags.join('');
    }

    function renderGroup({ label, badgeClass, messages, collapsed, username, room, query }) {
      const colClass = collapsed ? ' collapsed' : '';
      const delData = username
        ? `data-username="${esc(username)}" data-room="${esc(room ?? '')}"`
        : '';
      return `
        <div class="ctx-group${colClass}">
          <div class="ctx-header" onclick="if(!event.target.classList.contains('ctx-del'))this.closest('.ctx-group').classList.toggle('collapsed')">
            <span class="ctx-badge ${badgeClass}">${esc(badgeClass === 'dm' ? 'DM' : 'ROOM')}</span>
            <span class="ctx-title">${esc(label)}</span>
            <span class="ctx-count">${messages.length} message${messages.length !== 1 ? 's' : ''}</span>
            ${username ? `<span class="ctx-del" ${delData} title="Delete all">×</span>` : ''}
            <span class="ctx-chevron">▼</span>
          </div>
          <div class="ctx-messages">${renderMessages(messages, query)}</div>
        </div>`;
    }

    function render(messages) {
      if (!messages.length) {
        msgsEl.innerHTML = '<p class="placeholder">No messages found for this user.</p>';
        return;
      }

      const buckets = new Map();
      for (const m of messages) {
        const key = m.room ?? '__dm__';
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(m);
      }

      const frags = [];
      for (const [key, msgs] of buckets) {
        if (key === '__dm__') {
          frags.push(renderGroup({ label: 'Direct Messages', badgeClass: 'dm', messages: msgs, collapsed: false, username: currentUser, room: null }));
        } else {
          frags.push(renderGroup({ label: key, badgeClass: 'room', messages: msgs, collapsed: false, username: currentUser, room: key }));
        }
      }

      msgsEl.innerHTML = frags.join('');
    }

    function renderSearch(messages, query) {
      if (!messages.length) {
        msgsEl.innerHTML = '<p class="placeholder">No messages found matching that text.</p>';
        return;
      }

      // Group by peer+room for context
      const buckets = new Map();
      for (const m of messages) {
        const peer = (m.direction === 'sent' ? m.toUser : m.fromUser) ?? '?';
        const room = m.room;
        const key  = room ? `${peer}\0${room}` : peer;
        if (!buckets.has(key)) buckets.set(key, { peer, room, msgs: [] });
        buckets.get(key).msgs.push(m);
      }

      const total = messages.length;
      const groups = [...buckets.values()];
      const frags = [`<div style="font-size:11px;color:#555;padding:4px 4px 8px">${total} result${total !== 1 ? 's' : ''} across ${groups.length} conversation${groups.length !== 1 ? 's' : ''}</div>`];

      for (const { peer, room, msgs } of groups) {
        const label = room ? `${room}  ·  ${peer}` : peer;
        const badgeClass = room ? 'room' : 'dm';
        frags.push(renderGroup({ label, badgeClass, messages: msgs, collapsed: groups.length > 3, username: null, room, query }));
      }

      msgsEl.innerHTML = frags.join('');
    }

    function load() {
      const user = input.value.trim();
      if (!user) return;
      render(window.logAPI.queryUser(user));
      loadNote(user);
    }

    function runSearch() {
      const q = searchTextInput.value.trim();
      if (q.length < 2) {
        msgsEl.innerHTML = '<p class="placeholder">Enter at least 2 characters to search.</p>';
        return;
      }
      renderSearch(window.logAPI.searchMessages(q), q);
      notesPanel.style.display = 'none';
    }

    // Notes panel
    const notesPanel   = document.getElementById('notes-panel');
    const notesLabel   = document.getElementById('notes-label');
    const noteText     = document.getElementById('note-text');
    const saveNoteBtn  = document.getElementById('save-note');
    const saveConfirm  = document.getElementById('save-confirm');
    let currentUser    = null;

    const watchBtn = document.getElementById('watch-btn');

    function updateWatchBtn(username) {
      const watching = window.logAPI.isWatched(username);
      watchBtn.textContent = watching ? 'Watching' : 'Watch for presence';
      watchBtn.classList.toggle('watching', watching);
    }

    watchBtn.addEventListener('click', () => {
      if (!currentUser) return;
      const nowWatching = !window.logAPI.isWatched(currentUser);
      window.logAPI.setWatched(currentUser, nowWatching);
      updateWatchBtn(currentUser);
    });

    function loadNote(username) {
      currentUser = username;
      notesLabel.textContent = `Notes for ${username}`;
      noteText.value = window.logAPI.readNote(username);
      notesPanel.style.display = 'block';
      saveConfirm.textContent = '';
      updateWatchBtn(username);
    }

    saveNoteBtn.addEventListener('click', () => {
      if (!currentUser) return;
      window.logAPI.saveNote(currentUser, noteText.value);
      saveConfirm.textContent = 'Saved.';
      setTimeout(() => { saveConfirm.textContent = ''; }, 2000);
    });

    noteText.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveNoteBtn.click();
    });

    function reload() {
      if (activeTab === 'search') {
        runSearch();
        return;
      }
      const user = input.value.trim();
      if (user) load();
      else loadRecent();
    }

    // Event delegation for delete buttons
    msgsEl.addEventListener('click', e => {
      const msgDel = e.target.closest('.msg-del');
      if (msgDel) {
        e.stopPropagation();
        window.logAPI.deleteMessages([msgDel.dataset.sig]);
        reload();
        return;
      }
      const grpDel = e.target.closest('.ctx-del');
      if (grpDel) {
        e.stopPropagation();
        const username = grpDel.dataset.username;
        const room = grpDel.dataset.room || null;
        const label = room ? `messages in "${room}" with ${username}` : `DMs with ${username}`;
        if (!confirm(`Delete all ${label}?`)) return;
        window.logAPI.deleteGroup(username, room);
        reload();
      }
    });

    // Pre-fill with recent DMs on open
    function loadRecent() {
      const recent = window.logAPI.recentDMs();
      if (!recent.length) { msgsEl.innerHTML = '<p class="placeholder">No recent messages.</p>'; return; }
      msgsEl.innerHTML = recent.map(({ peer, messages }, i) =>
        renderGroup({ label: peer, badgeClass: 'dm', messages, collapsed: i > 0, username: peer, room: null })
      ).join('');
    }

    loadRecent();

    btn.addEventListener('click', load);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

    searchBtn.addEventListener('click', runSearch);
    searchTextInput.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  </script>
</body>
</html>
